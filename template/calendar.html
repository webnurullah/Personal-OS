<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calendar · Nurullah POS</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700&text=%E0%A7%B3&display=swap">
  <link rel="stylesheet" href="assets/css/app.css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3"></script>
</head>
<body data-page="calendar" class="bg-[#f5f7fb] text-slate-800 antialiased">
  <div id="sidebar-root"></div>

  <div class="lg:pl-60">
    <div id="topbar-root"></div>

    <main class="mx-auto w-full max-w-[1720px] px-4 py-6 sm:px-6 xl:px-8">
      <!-- Page header -->
      <div class="flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
        <div>
          <h1 class="text-3xl font-bold tracking-tight text-slate-900">Calendar</h1>
          <p class="mt-1 text-slate-500">Your days, at a glance.</p>
        </div>
        <button type="button" class="btn btn-primary self-start sm:self-auto" data-modal-open="event-modal"><i data-lucide="plus" class="size-4"></i>New Event</button>
      </div>

      <div class="mt-6 grid grid-cols-1 gap-5 xl:grid-cols-[minmax(0,1fr)_22rem]">
        <!-- ============ Month view ============ -->
        <section class="card overflow-hidden" aria-label="Month view">
          <div class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-100 p-4 sm:px-5">
            <div class="flex items-center gap-2">
              <h2 id="cal-title" class="min-w-44 text-xl font-bold text-slate-900">September 2026</h2>
              <button type="button" id="cal-prev" class="btn btn-ghost btn-sm btn-icon" aria-label="Previous month"><i data-lucide="chevron-left" class="size-4"></i></button>
              <button type="button" id="cal-next" class="btn btn-ghost btn-sm btn-icon" aria-label="Next month"><i data-lucide="chevron-right" class="size-4"></i></button>
              <button type="button" id="cal-today" class="btn btn-secondary btn-sm ml-1">Today</button>
            </div>
            <ul class="flex flex-wrap items-center gap-x-4 gap-y-1 text-xs text-slate-600">
              <li class="flex items-center gap-1.5"><span class="size-2.5 rounded-full bg-blue-500"></span>Work</li>
              <li class="flex items-center gap-1.5"><span class="size-2.5 rounded-full bg-violet-500"></span>Personal</li>
              <li class="flex items-center gap-1.5"><span class="size-2.5 rounded-full bg-emerald-500"></span>Health</li>
              <li class="flex items-center gap-1.5"><span class="size-2.5 rounded-full bg-teal-500"></span>Learning</li>
              <li class="flex items-center gap-1.5"><span class="size-2.5 rounded-full bg-amber-500"></span>Finance</li>
            </ul>
          </div>
          <div class="grid grid-cols-7 border-b border-slate-100 bg-slate-50/70 text-center text-xs font-semibold uppercase tracking-wide text-slate-500">
            <div class="py-2.5">Mon</div><div class="py-2.5">Tue</div><div class="py-2.5">Wed</div><div class="py-2.5">Thu</div><div class="py-2.5">Fri</div><div class="py-2.5">Sat</div><div class="py-2.5">Sun</div>
          </div>
          <!-- Filled by calendar.js -->
          <div id="cal-grid" class="grid grid-cols-7"></div>
        </section>

        <!-- ============ Side panel ============ -->
        <aside class="space-y-5">
          <section class="card p-5" aria-labelledby="agenda-date">
            <div class="flex items-start justify-between gap-3">
              <div>
                <p id="agenda-label" class="text-xs font-semibold uppercase tracking-wide text-blue-600">Today</p>
                <h2 id="agenda-date" class="text-lg font-bold text-slate-900">Monday, September 21</h2>
              </div>
              <button type="button" class="btn btn-secondary btn-sm btn-icon" data-modal-open="event-modal" aria-label="Add event on this day"><i data-lucide="plus" class="size-4"></i></button>
            </div>
            <ol id="agenda-list" class="mt-4 space-y-1"></ol>
          </section>

          <section class="card p-5" aria-labelledby="upcoming-title">
            <h2 id="upcoming-title" class="card-title">Coming up</h2>
            <ol id="upcoming-list" class="mt-3 divide-y divide-slate-100"></ol>
          </section>
        </aside>
      </div>
    </main>
  </div>

  <!-- ============ New event window ============ -->
  <dialog id="event-modal" data-new-modal aria-labelledby="event-modal-title" class="w-[calc(100%-2rem)] max-w-lg rounded-2xl bg-white p-0 shadow-2xl">
    <form id="event-form" class="p-6">
      <div class="flex items-start justify-between gap-4">
        <div>
          <h2 id="event-modal-title" class="text-lg font-semibold text-slate-900">New event</h2>
          <p class="text-sm text-slate-500">Block time for what matters.</p>
        </div>
        <button type="button" class="btn btn-ghost btn-sm btn-icon -mr-2 -mt-1" data-modal-close aria-label="Close"><i data-lucide="x" class="size-5"></i></button>
      </div>
      <div class="mt-5 space-y-4">
        <div>
          <label class="label" for="event-title">Title</label>
          <input id="event-title" name="title" class="input" required placeholder="e.g. Coffee with Rahim" autocomplete="off">
        </div>
        <div class="grid grid-cols-1 gap-4 sm:grid-cols-3">
          <div class="sm:col-span-1">
            <label class="label" for="event-date">Date</label>
            <input id="event-date" name="date" type="date" class="input" required>
          </div>
          <div>
            <label class="label" for="event-start">Starts</label>
            <input id="event-start" name="start" type="time" class="input" value="10:00" required>
          </div>
          <div>
            <label class="label" for="event-end">Ends</label>
            <input id="event-end" name="end" type="time" class="input" value="11:00" required>
          </div>
        </div>
        <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
          <div>
            <label class="label" for="event-cat">Category</label>
            <select id="event-cat" name="category" class="select select-lg">
              <option>Work</option><option selected>Personal</option><option>Health</option><option>Learning</option><option>Finance</option>
            </select>
          </div>
          <div>
            <label class="label" for="event-note">Place or note</label>
            <input id="event-note" name="note" class="input" placeholder="Optional" autocomplete="off">
          </div>
        </div>
      </div>
      <div class="mt-6 flex justify-end gap-2">
        <button type="button" class="btn btn-secondary" data-modal-close>Cancel</button>
        <button type="submit" class="btn btn-primary">Add event</button>
      </div>
    </form>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/lucide@1.47.0/dist/umd/lucide.min.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/calendar.js"></script>
</body>
</html>
